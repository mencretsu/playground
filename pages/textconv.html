<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Konversi Angka & Singkatan ke Teks</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 0 15px; background:#f5f5f5; }
  h2 { color:#222; }
  textarea { width:100%; height:140px; font-size:15px; padding:10px; box-sizing:border-box; }
  button { margin-top:10px; padding:10px 20px; font-size:15px; background:#2563eb; color:#fff; border:none; border-radius:5px; cursor:pointer; }
  button:hover { background:#1e4fc4; }
  #hasil { white-space:pre-wrap; background:#fff; border:1px solid #ccc; padding:15px; margin-top:15px; border-radius:5px; min-height:60px; }
  .label { font-weight:bold; margin-top:15px; display:block; }
</style>
</head>
<body>

<h2>Konversi Angka & Singkatan ke Teks</h2>
<p>Angka dibaca utuh sesuai nilainya (17 → tujuh belas, 321 → tiga ratus dua puluh satu), huruf kapital berdiri sendiri (DPR → de pe er).<br>
Kecuali: <span id="daftarKecuali"></span> (tidak ikut dieja).</p>

<span class="label">Teks Asli:</span>
<textarea id="input" placeholder="Contoh: JAKARTA, KOMPASTV - Banjir bandang di Sungai Bhote Koshi, Nepal, menewaskan 389 orang..."></textarea>

<button onclick="konversi()">Konversi</button>

<span class="label">Hasil:</span>
<div id="hasil"></div>
<button onclick="salinHasil()" id="btnCopy">Copy</button>

<script>
const angka = {
  '0':'nol','1':'satu','2':'dua','3':'tiga','4':'empat',
  '5':'lima','6':'enam','7':'tujuh','8':'delapan','9':'sembilan'
};

const huruf = {
  'A':'a','B':'be','C':'ce','D':'de','E':'e','F':'ef','G':'ge',
  'H':'ha','I':'i','J':'je','K':'ka','L':'el','M':'em','N':'en',
  'O':'o','P':'pe','Q':'ki','R':'er','S':'es','T':'te','U':'u',
  'V':'ve','W':'we','X':'eks','Y':'ye','Z':'zet'
};

function terbilang(n) {
  const satuan = ['', 'satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];
  if (n < 12) return satuan[n];
  if (n < 20) return terbilang(n - 10) + ' belas';
  if (n < 100) return terbilang(Math.floor(n / 10)) + ' puluh' + (n % 10 !== 0 ? ' ' + terbilang(n % 10) : '');
  if (n < 200) return 'seratus' + (n - 100 !== 0 ? ' ' + terbilang(n - 100) : '');
  if (n < 1000) return terbilang(Math.floor(n / 100)) + ' ratus' + (n % 100 !== 0 ? ' ' + terbilang(n % 100) : '');
  if (n < 2000) return 'seribu' + (n - 1000 !== 0 ? ' ' + terbilang(n - 1000) : '');
  if (n < 1000000) return terbilang(Math.floor(n / 1000)) + ' ribu' + (n % 1000 !== 0 ? ' ' + terbilang(n % 1000) : '');
  if (n < 1000000000) return terbilang(Math.floor(n / 1000000)) + ' juta' + (n % 1000000 !== 0 ? ' ' + terbilang(n % 1000000) : '');
  if (n < 1000000000000) return terbilang(Math.floor(n / 1000000000)) + ' miliar' + (n % 1000000000 !== 0 ? ' ' + terbilang(n % 1000000000) : '');
  return terbilang(Math.floor(n / 1000000000000)) + ' triliun' + (n % 1000000000000 !== 0 ? ' ' + terbilang(n % 1000000000000) : '');
}

function ejaAngka(str) {
  // pisahkan bagian bulat & desimal (150.000 = seratus lima puluh ribu, 3,5 = tiga koma lima)
  let bagian = str.split(',');
  let bulatStr = bagian[0].replace(/\./g, ''); // buang titik ribuan
  let n = parseInt(bulatStr, 10);
  if (isNaN(n)) return str;

  let hasil = (n === 0) ? 'nol' : terbilang(n).trim();

  if (bagian[1]) {
    const angkaMap = {'0':'nol','1':'satu','2':'dua','3':'tiga','4':'empat','5':'lima','6':'enam','7':'tujuh','8':'delapan','9':'sembilan'};
    hasil += ' koma ' + bagian[1].split('').map(d => angkaMap[d] || d).join(' ');
  }
  return hasil;
}

function ejaSingkatan(str) {
  return str.split('').map(h => huruf[h] || h).join(' ');
}

// kata yang TIDAK ikut dikonversi meski huruf kapital semua
const pengecualian = ['JAKARTA', 'KOMPASTV'];
document.getElementById('daftarKecuali').textContent = pengecualian.join(', ');

function salinHasil() {
  const teks = document.getElementById('hasil').textContent;
  if (!teks) return;
  navigator.clipboard.writeText(teks).then(() => {
    const btn = document.getElementById('btnCopy');
    const asli = btn.textContent;
    btn.textContent = 'Tersalin!';
    setTimeout(() => { btn.textContent = asli; }, 1500);
  });
}
function konversi() {
  const teks = document.getElementById('input').value;

  // pisahkan berdasarkan kata (pertahankan spasi & tanda baca)
  const pola = /\b[A-Z]{2,}\b|\b\d{1,3}(?:\.\d{3})+(?:,\d+)?\b|\b\d+(?:,\d+)?\b/g;
  const hasil = teks.replace(pola, (match) => {
    if (/^[A-Z]{2,}$/.test(match)) {
      if (pengecualian.includes(match)) {
        return match; // dilewati, tidak dieja
      }
      return ejaSingkatan(match);
    }
    return ejaAngka(match);
  });

  document.getElementById('hasil').textContent = hasil;
}
</script>

</body>
</html>
